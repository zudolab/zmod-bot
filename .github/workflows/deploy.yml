# Deploy pipeline for the zmod-bot Worker.
#
# Typecheck + test run here, duplicating ci.yml, precisely because this
# workflow also applies migrations to production D1 and activates a new
# production Worker version: an untested push must not reach either. The
# duplication is deliberate — a PR gate can be bypassed by pushing straight
# to main, and this is the step that must not be.

name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # 24, not 22: src/router.ts uses URLPattern, a global only from
          # Node 24 (workerd has it natively — this is a test-runner
          # constraint, not a runtime one). See readycrew-viewer for the
          # precedent (app/.github/workflows/deploy-app.yml).
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Apply D1 migrations (remote)
        # "zmod-bot" must match wrangler.jsonc's d1_databases[0].database_name
        # (the D1 database identifier Cloudflare assigned) — NOT the DB
        # binding name and not the Worker name (they happen to match today,
        # but only one of them is what this command actually reads).
        run: npx wrangler d1 migrations apply zmod-bot --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy
